name: Build All Weather Drill (recovered tested baseline)

on:
  push:
    branches: [main]
    paths:
      - 'BuildAWD/**'
      - 'AllWeatherDrill/**'
      - 'scripts/**'
      - '.github/workflows/build-all-weather-drill.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch same reference assemblies used by September 2026 successful build
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/kamigari84/Automation_WeatherModifiers_Signals.git /tmp/tbrefs
          git -C /tmp/tbrefs checkout a4b8b5f82a88866a545e925af5cc1f82aefe496e
          test -d /tmp/tbrefs/bin/Release/netstandard2.1
      - name: Verify restored source and packaging input parity
        run: python3 scripts/check_recovered_baseline.py
      - name: Compile against public precompiled reference assemblies (NOT handwritten stubs)
        run: dotnet build BuildAWD/AllWeatherDrill.csproj -c Release -p:PublicRefDir=/tmp/tbrefs/bin/Release/netstandard2.1 --nologo
      - name: Verify output and compare with September artifact checksum
        run: |
          python3 scripts/verify_build.py "BuildAWD/bin/Release/netstandard2.1/all weather drills.dll"
          python3 scripts/check_recovered_baseline.py "BuildAWD/bin/Release/netstandard2.1/all weather drills.dll"
      - name: Package complete single mod directory (not ZIP inside ZIP)
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/installable/AllWeatherDrill/version-1.0.11.2"
          mkdir -p "$root/Patches" "$root/Localizations"
          cp "BuildAWD/bin/Release/netstandard2.1/all weather drills.dll" "$root/Patches/all weather drills.dll"
          cp "BuildAWD/AllWeatherDrill.cs" "$root/Patches/all weather drills.cs"
          cp "BuildAWD/package/manifest.json" "$root/manifest.json"
          cp "BuildAWD/package/enUS.csv" "$root/Localizations/enUS.csv"
          cp "AllWeatherDrill/version-1.0.11.2/Change Log" "$root/Change Log"
          test -s "$root/Patches/all weather drills.dll"
      - name: Upload installable mod directory
        uses: actions/upload-artifact@v4
        with:
          name: AllWeatherDrill-recovered-tested-source-build
          path: ${{ runner.temp }}/installable/
          if-no-files-found: error
